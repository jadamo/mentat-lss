name: Publish new release to PyPI and Github

# Specifies that this action will run when main gets a new push
on: 
  push:
    branches:
      - main

jobs:
  check-version: # <- will exit early if the version is not new
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi


  build: # <- needs to be seperate from publish jobs
    name: Build distribution
    runs-on: ubuntu-latest
    needs:
      - check-version
    if: needs.check-version.outputs.is_new == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pypa/build
        run: >-
          python -m pip install --user build
      - name: Build wheel / source files
        run: python -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
  
  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - check-version
      - build
    if: needs.check-version.outputs.is_new == 'true'
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mentat-lss
    permissions:
      id-token: write
    steps:
      - name: Download the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release_to_github:
    name: Release pushed tag
    needs:
      - check-version
      - publish-to-pypi
    if: needs.check-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.check-version.outputs.tag }}
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --target="$GITHUB_SHA" \
              --title="${tag#v}" \
              --generate-notes